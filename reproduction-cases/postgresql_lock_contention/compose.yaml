name: pg-lock-rca

services:
  postgres:
    image: ${PG_IMAGE:-postgres:17-bookworm}
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: synthetic-demo-only
      POSTGRES_DB: lock_lab
    # No host port. All access uses docker compose exec in this disposable lab.
    volumes:
      - ./sql:/lab/sql:ro
    command:
      - postgres
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=500ms
      - -c
      - 'log_line_prefix=%m [%p] %a %u@%d '
      - -c
      - log_timezone=UTC
      - -c
      - timezone=UTC
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab -d lock_lab]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 10s
